<?xml version="1.0" encoding="UTF-8"?>
<!-- Russian Federation: white / blue / red. Colour artwork, not a currentColor glyph — LanguageManager::flagIcon()
     loads it as-is so both themes get the same recognisable stripes. 22x16 with a rounded clip. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 16" width="22" height="16">
  <defs><clipPath id="c"><rect width="22" height="16" rx="2.5"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="22" height="16" fill="#F4F5F7"/>
    <rect y="5.33" width="22" height="5.34" fill="#0057A8"/>
    <rect y="10.66" width="22" height="5.34" fill="#D52B1E"/>
  </g>
  <rect x="0.5" y="0.5" width="21" height="15" rx="2.2" fill="none" stroke="#2A2E39" stroke-opacity="0.55"/>
</svg>
