     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.2 4.2v15.2h15.6"/>
    <path d="M8.2 19.4v-4.6"/>
    <path d="M12.4 19.4V11"/>
    <path d="M16.6 19.4V7.4"/>
</svg>
