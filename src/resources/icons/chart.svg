<!-- Rail "История": three bars rising off a baseline. The journal says what happened, in order; this
     page answers the question a journal cannot — how much of it worked — so its glyph is an aggregate
     rather than another list. Three strokes and an axis, because the rail draws it at 24 px beside
     glyphs of the same weight.
     Monochrome currentColor + declared 24px box — see icons/app.svg for the contract. -->
