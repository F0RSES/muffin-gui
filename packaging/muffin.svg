<?xml version="1.0" encoding="UTF-8"?>
<!-- Application icon for packaged installs (share/icons/hicolor/scalable/apps/muffin.svg).

     Deliberately a copy of src/resources/icons/app.svg with explicit paints instead of currentColor.
     The in-app copy is a monochrome glyph that Theme::icon() recolours at load time, which only works
     because Qt parses it; a hicolor icon is read by the desktop environment's own SVG loader, which has
     no such recolouring step, so currentColor would resolve to whatever the DE happens to pass. This
     file therefore carries its own colours. Keep the two glyphs in sync when the artwork changes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <path d="M3.7 12.3c0-3.9 3.3-6.4 8.3-6.4s8.3 2.5 8.3 6.4"
          fill="none" stroke="#c084fc" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5.2 12.3h13.6l-1.5 7.3a1.7 1.7 0 0 1-1.66 1.33H8.36A1.7 1.7 0 0 1 6.7 19.6z"
          fill="#15161c" stroke="#c084fc" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9.7 13.6l.5 6.1M14.3 13.6l-.5 6.1"
          fill="none" stroke="#c084fc" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M12 5.9V4.4" fill="none" stroke="#22d3ee" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="12" cy="2.9" r="1.5" fill="#22d3ee"/>
</svg>
