name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two separate jobs (not a matrix) so a single OS can be re-run independently while the
# Windows MSVC path is still being debugged. Runner images are pinned explicitly:
#   - ubuntu-latest is migrating to a newer Ubuntu shortly and its apt Qt would float with it,
#   - windows-latest tracks the newest VS/Windows image; windows-2022 pins VS 2022.
#
# Qt is installed by jurplel/install-qt-action@v4.4.1 on BOTH platforms, pinned to the same
# concrete 6.7.3 (no wildcards). The distro Qt from apt can no longer be used: the project's
# real floor is Qt 6.6, not 6.2 —
#   - QPalette::Accent            -> Qt 6.6  (src/ui/Theme.cpp:80)
#   - QStyleHints::colorScheme()  -> Qt 6.5  (src/ui/Theme.cpp:121)
#   - Qt::ColorScheme             -> Qt 6.5
# Ubuntu 22.04 ships Qt 6.2.4, which has none of these (that is what broke the Linux job).
# Using one installer on both runners also removes OS version drift: Linux and Windows now
# compile against byte-identical headers, so an API that exists on one exists on the other.
#
# install-qt-action facts verified against the code it ships at tag v4.4.1:
#   - `modules` is deliberately ABSENT. It names aqtinstall add-on modules; an unknown name
#     ("qtsvg", "qtbase") makes aqt fail — that is what broke the Windows job. QtBase is always
#     installed and is not a module; SVG rendering support is not something this build needs
#     requested separately.
#   - `install-deps` defaults to true and, on Linux only, runs its own `sudo apt-get update`
#     plus installs build-essential, libgl1-mesa-dev, libxkbcommon-dev, the xcb libs and
#     libxcb-cursor0 (Qt >= 6.5) that the pre-built Qt needs at link/run time. It runs before
#     the download, so the apt step below exists mainly for ninja/cmake.
#   - The action exports QT_ROOT_DIR. It does NOT export `Qt6_DIR` (that name only exists as the
#     CMake cache variable written by find_package(Qt6)); `Qt5_DIR` is set for Qt 5 only. So the
#     CMake prefix is taken from $QT_ROOT_DIR/lib/cmake, as the action's README recommends.
#   - `cache: true` keys the automatic cache on version/host/target/arch, so it stays correct
#     when the pinned version is bumped.
#
# Tests run in fixture mode: forcing ZAPRET_TEST_TREE to a non-existent path makes coretest
# generate a minimal zapret distribution tree (see tests/coretest.cpp), so the parser/locator
# assertions stay meaningful without downloading zapret, and checkWindowsCount asserts landmarks
# only (g_winStrategies == -1 for an unpinned tree). uitest runs headless on the offscreen
# platform plugin, which CMakeLists.txt locates via ${Qt6_DIR}/../../../plugins/platforms —
# for an aqt install that resolves to $QT_ROOT_DIR/plugins/platforms, where the plugin really is.
#
# Packaging lives partly inside the two build jobs and partly in a fifth one:
#   - The .deb is produced at the tail of the `linux` job. CPack needs the same build tree that
#     just ran ctest, and dpkg-deb is available everywhere Ubuntu is, so a dedicated job would
#     only re-install Qt and re-run cmake for no benefit.
#   - The .exe cannot live in the `windows` job because Inno Setup's compiler (ISCC) is
#     Delphi/Windows-only and the payload has to be validated before it is packaged; a separate
#     `installer` job makes that gate explicit.
#   - `release` is tag-gated and needs both packaging jobs, so a release is never published from
#     a commit whose tests did not pass. See the two jobs at the bottom of this file.
# Every packaging step reads MUFFIN_VERSION / AppVersion from the tag itself (Configure here,
# ISCC in the installer job), which is what keeps the .deb file name, the .exe file name and the
# git tag in agreement.

jobs:
  linux:
    name: Linux (ubuntu-22.04, Qt 6.7.3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Lint Inno Setup script
        # ISCC rejects an unknown token in a [Run] `Flags:` value with
        # `Parameter "Flags" includes an unknown flag.` -- which is a compile-time check on text that
        # never needed Windows, Qt or the build to happen first. Doing it here costs ~2 s on Linux and
        # stops the run before the tag-gated `installer` job burns a Windows runner (install Qt ->
        # build -> artifact round-trip -> ISCC) to report the same typo.
        # It lives in `linux` and not `windows` because `linux` is the job that runs on every push and
        # PR; `installer` only exists on a tag, so a branch-level typo would go unnoticed until release.
        run: python3 packaging/check-iss-flags.py packaging/windows_installer.iss

      - name: Check the Windows resources
        # packaging/windows/app.rc, app.manifest and muffin.ico decide how the exe behaves before
        # any of its code runs, and no build step inspects what they decide. The one that matters
        # was measured on this host with the real toolchain: naming the manifest
        # `CREATEPROCESS_MANIFEST_RESOURCE_ID 24` instead of `1 24` makes windres exit 0 and emit
        # RT_MANIFEST under the STRING name "CREATEPROCESS_MANIFEST_RESOURCE_ID". CreateProcess
        # reads the execution level from ordinal 1 only, so the process starts asInvoker,
        # WindowsBackend::start() refuses every elevated-required strategy, and what the user sees
        # reads like a WinDivert or driver failure -- from a build that reported success. rc.exe at
        # least stops with RC2104, but no CI job runs MinGW, and the same silent path applies to a
        # manifest that is not well-formed XML, to an .ico the shell cannot decode, and to a payload
        # app.rc names that CMakeLists.txt does not stage into the build directory (that last one
        # fails on MSVC only, and only after a Windows runner installed Qt and built everything).
        # Runs here, beside the Inno lint, for the same two reasons: every assertion is about text
        # and bytes rather than about a built artefact, and `linux` is the job that runs on every
        # push and PR -- `installer` only exists on a tag, so a regression would be merged first.
        # Takes ~0.1 s and needs no Qt, no compiler and no Windows.
        run: python3 packaging/check-win-resources.py

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libgl1-mesa-dev

      - name: Configure
        # MUFFIN_VERSION is only stamped when this is a release tag: on a PR/branch build the
        # default in CMakeLists.txt is fine (and cpack is skipped below anyway). Stripping the
        # leading `v` is what makes muffin_<tag-without-v>_amd64.deb line up with the tag name,
        # matching what `installer` does for the .exe.
        run: |
          ver_args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver_args+=("-DMUFFIN_VERSION=${GITHUB_REF_NAME#v}")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake" "${ver_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (fixture mode)
        env:
          QT_QPA_PLATFORM: offscreen
          ZAPRET_TEST_TREE: /tmp/not-a-zapret-tree
        run: ctest --test-dir build --output-on-failure

      # The polkit rule that packaging/postinst installs is what makes `apt install muffin` a
      # one-time authorisation instead of a per-pkexec prompt. Getting it wrong in the loose
      # direction is a local root: polkit hands a rule the `program` detail = the exact binary
      # pkexec will exec, and the zapret payload this GUI downloads lives in the user's own home,
      # so a rule that matches by filename suffix exempts attacker-controlled bytes. Getting it
      # wrong in the strict direction is silent too: a `#` shell-style comment anywhere in the
      # rule makes polkitd's JS parser throw at boot and the whole file is skipped.
      #
      # packaging/check-polkit-rule.js evaluates the rule against a stub of the polkit JS API and
      # asserts both directions. Runs on every push/PR (not just tags) because the bug it catches
      # is in a text file, not in the built artefact -- by the time a tag build happens the
      # regression has already been merged. Node is pre-installed on ubuntu-22.04 runners; the
      # harness has no runtime dependencies beyond the standard library.
      - name: Check the polkit rule
        run: node packaging/check-polkit-rule.js

      # The polkit check above evaluates the rule as text. This one runs the scripts that write it,
      # end to end, as root on the throwaway runner: postinst must create the namespace and install a
      # 0644 root:root rule (or skip cleanly where polkit is absent), and postrm must take the rule and
      # the promoted tree away on purge while leaving them alone mid-upgrade. The half that cannot be
      # checked from a string is the half where mistakes actually happen -- a rule that parses but never
      # lands, a `remove` that deletes the authorisation the upgrade still needs, a purge that leaves a
      # passwordless payload behind on a machine with no Muffin to run it.
      #
      # Skipped where the runner cannot become root without a password (fork PRs run with a token that
      # still allows sudo on the ephemeral macOS/Linux runners, so this normally runs); reporting a
      # skip is better than a red check on a configuration that was never going to be installable.
      - name: Exercise the maintainer scripts
        run: |
          set -euo pipefail
          if ! sudo -n true 2>/dev/null; then
            echo "no passwordless sudo on this runner; skipping"
            exit 0
          fi
          RULES_DIR=/etc/polkit-1/rules.d
          RULE="$RULES_DIR/49-muffin-nopasswd.rules"
          NS=/opt/muffin

          sudo rm -rf "$RULE" "$NS"
          sudo bash packaging/postinst configure 0.0.0

          if [ -d "$RULES_DIR" ]; then
            test -f "$RULE" || { echo "postinst did not write the rule"; exit 1; }
            stat -c '%a %U:%G' "$RULE" | grep -qx '644 root:root' \
              || { echo "rule has wrong mode/owner: $(stat -c '%a %U:%G' "$RULE")"; exit 1; }
            # A rule with a shell comment makes polkitd's JS engine throw and silently skip the whole
            # file for the boot, which looks exactly like the feature not working.
            node packaging/check-polkit-rule.js "$RULE" > /dev/null
            grep -q '/opt/muffin/zapret/' "$RULE" || { echo "installed rule lacks the tree"; exit 1; }
          else
            echo "no rules.d on this host; postinst must have skipped cleanly"
          fi
          test -d "$NS" || { echo "postinst did not create $NS"; exit 1; }
          [ "$(stat -c '%U:%G %a' "$NS")" = "root:root 755" ] \
            || { echo "$NS is not root-owned 755: $(stat -c '%U:%G %a' "$NS")"; exit 1; }

          # An upgrade must not touch either half: dpkg runs the old postrm with `upgrade` while the new
          # postinst has already rewritten the rule.
          if [ -d "$RULES_DIR" ]; then
            sudo bash packaging/postrm upgrade 0.0.0
            test -f "$RULE" || { echo "postrm deleted the rule mid-upgrade"; exit 1; }
            test -d "$NS" || { echo "postrm deleted the tree mid-upgrade"; exit 1; }
          fi

          # A planted payload and its staging sibling both go on purge, and only on purge.
          sudo mkdir -p "$NS/zapret/binaries" "$NS/zapret.new"
          echo x | sudo tee "$NS/zapret/binaries/nfqws" > /dev/null
          sudo bash packaging/postrm purge
          test ! -e "$NS/zapret" || { echo "purge left the promoted tree"; exit 1; }
          test ! -e "$NS/zapret.new" || { echo "purge left the staging sibling"; exit 1; }
          test ! -d "$NS" || { echo "purge left a namespace it had emptied"; exit 1; }
          if [ -d "$RULES_DIR" ]; then
            test ! -e "$RULE" || { echo "purge left the passwordless rule installed"; exit 1; }
          fi

          # A namespace holding something that is not ours survives: rmdir only empties.
          sudo rm -rf "$NS" 2>/dev/null || true
          sudo mkdir -p "$NS"; echo keep | sudo tee "$NS/not-muffin.txt" > /dev/null
          sudo bash packaging/postrm purge
          test -f "$NS/not-muffin.txt" || { echo "purge deleted an unrelated file under $NS"; exit 1; }
          sudo rm -rf "$NS"
          echo "maintainer scripts ok"


      # CPack runs against the tree that just passed ctest; the DEB generator is auto-selected in
      # CMakeLists.txt because dpkg-deb is present on ubuntu-22.04. Pinning -G DEB here anyway so a
      # future change to the auto-default cannot silently turn the release into a TGZ.
      - name: Build the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: cpack -G DEB
        working-directory: build

      # Verify the .deb actually contains what we claim. CPack would happily produce an empty or
      # misnamed package if the install() rules or the version threading drifted.
      - name: Verify the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected="muffin_${GITHUB_REF_NAME#v}_amd64.deb"
          if [[ ! -f "build/$expected" ]]; then
            echo "expected build/$expected, found:"; ls -la build/*.deb || true
            exit 1
          fi
          # Control fields the release actually depends on.
          dpkg-deb -f "build/$expected" Package Version Architecture Depends \
            | tee /tmp/deb-control
          grep -q "^Package: muffin$"                /tmp/deb-control
          grep -q "^Version: ${GITHUB_REF_NAME#v}$"  /tmp/deb-control
          grep -q "^Architecture: amd64$"            /tmp/deb-control
          # Payload: binary + desktop entry + themed icon (see install() rules in CMakeLists.txt).
          dpkg-deb -c "build/$expected" > /tmp/deb-list
          grep -q './usr/bin/Muffin$'                                   /tmp/deb-list
          grep -q './usr/share/applications/muffin.desktop$'            /tmp/deb-list
          grep -q './usr/share/icons/hicolor/scalable/apps/muffin.svg$' /tmp/deb-list
          # The root helper that promotes a download into /opt/muffin/zapret, and with it two facts the
          # security model depends on. Its path: MuffinInstallHelper::installedProgram() execs exactly
          # /usr/lib/muffin/muffin-install-helper through pkexec, and check-polkit-rule.js asserts the
          # polkit rule REFUSES that path — promotion is the one write into the passwordless tree that
          # must still cost a password, so a helper shipped elsewhere is either a feature that never
          # runs or a rule that has stopped meaning anything. And its mode: findProgram() deliberately
          # refuses a group- or world-writable helper, so a 0775 file here silently disables promotion
          # on every machine the package installs on.
          grep -qE '^-rwxr-xr-x root/root +[0-9]+ .* \./usr/lib/muffin/muffin-install-helper$' \
            /tmp/deb-list || { echo "muffin-install-helper is missing from the deb, or not 0755 root:root"; \
                               grep -n muffin-install-helper /tmp/deb-list || true; exit 1; }

          # The helper is a root-owned binary whose behaviour changed across releases, so a report has
          # to be able to say which one ran. MUFFIN_VERSION reaches it as a compile definition, which
          # means a packaging slip could ship a stale one while every file name and control field says
          # the truth. Read the version out of the binary inside the package and hold it to the tag.
          rm -rf /tmp/deb-root && mkdir -p /tmp/deb-root
          dpkg-deb -x "build/$expected" /tmp/deb-root
          /tmp/deb-root/usr/lib/muffin/muffin-install-helper --help | tee /tmp/deb-helper-help
          grep -q "^Version: ${GITHUB_REF_NAME#v}$" /tmp/deb-helper-help \
            || { echo "the helper in the deb does not report the tag version"; exit 1; }

          # Maintainer scripts live in the CONTROL member, so every check above passes happily without
          # them. dpkg refuses to configure a package whose postinst is not executable, and a missing
          # postrm leaves the polkit rule installed after removal — both are silent until a user hits
          # them, so both are asserted here instead. sh -n parses (dash on Ubuntu, like the target).
          rm -rf /tmp/deb-ctl && mkdir -p /tmp/deb-ctl
          dpkg-deb --ctrl-tarfile "build/$expected" | tar -xC /tmp/deb-ctl
          for s in postinst postrm; do
            if [ ! -f "/tmp/deb-ctl/$s" ] || [ ! -x "/tmp/deb-ctl/$s" ]; then
              echo "$s is missing from the control member or not executable:"
              ls -la /tmp/deb-ctl
              exit 1
            fi
            sh -n "/tmp/deb-ctl/$s"
          done
          # Regression guard on the shape of the rule, not its wording: polkit's `program` detail is
          # whatever binary pkexec execs, and the payload the GUI downloads sits in the user's own
          # home. Authorising it by name suffix is a local root, so suffix-only matching must never
          # come back. (A proxy for the invariant, and cheap enough to keep.)
          if grep -q 'endsWith\|startsWith' /tmp/deb-ctl/postinst; then
            echo "postinst must not authorise a pkexec target by name prefix/suffix alone:"
            grep -n 'endsWith\|startsWith' /tmp/deb-ctl/postinst
            exit 1
          fi
          echo "deb ok: $(du -h "build/$expected" | cut -f1)"

      - name: Upload the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-deb-x64
          path: build/muffin_*.deb
          if-no-files-found: error

      - name: Upload portable artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-linux-x64
          path: |
            build/Muffin
            packaging/muffin.desktop
            packaging/muffin.svg
            README.md
            LICENSE

  windows:
    name: Windows (windows-2022, Qt 6.7.3 MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install Qt6
        # win64_msvc2019_64 is the correct arch for Qt 6.7 on VS 2022 (the MSVC 2019 and 2022
        # toolsets are binary-compatible); win64_msvc2022_64 only exists from Qt 6.8 on.
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (fixture mode)
        env:
          QT_QPA_PLATFORM: offscreen
          ZAPRET_TEST_TREE: /tmp/not-a-zapret-tree
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt DLLs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw build/Release/Muffin.exe

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-windows-x64
          # The last three directories are windeployqt/Qt-version dependent. upload-artifact only
          # reports if-no-files-found when the whole list matched nothing, so listing a directory that
          # this Qt does not ship neither fails the job nor leaves the installer missing it: ISCC reads
          # whatever arrived. iconengines matters most (qsvgicon.dll renders the toolbar SVG icons).
          path: |
            build/Release/Muffin.exe
            build/Release/Qt6*.dll
            build/Release/platforms/
            build/Release/imageformats/
            build/Release/styles/
            build/Release/iconengines/
            build/Release/networkinformation/
            build/Release/tls/
            README.md
            LICENSE


  installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-2022
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Fetch the Windows build
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-windows-x64
          path: win
          # upload-artifact keeps the workspace-relative paths it was handed, so the payload arrives
          # under win\build\Release rather than win\. That nesting is why the .iss is given StagingDir
          # explicitly instead of relying on its hand-run default.

      - name: Check the payload
        shell: pwsh
        run: |
          $rel = 'win\build\Release'
          foreach ($f in @('Muffin.exe', 'platforms\qwindows.dll')) {
            if (-not (Test-Path (Join-Path $rel $f))) {
              throw "artifact is missing $f -- refusing to package a broken payload"
            }
          }
          # A Qt6*.dll that simply was not deployed would otherwise compile into an installer that
          # ships no Qt at all (the .iss tolerates a missing source), so it is asserted here.
          if (-not (Get-ChildItem $rel -Filter 'Qt6*.dll' -File)) { throw "no Qt6*.dll in $rel" }
          $files = @(Get-ChildItem $rel -Recurse -File)
          $mib = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Output "payload ok: $($files.Count) files, $mib MiB"

      - name: Compile the installer
        shell: pwsh
        run: |
          # Inno Setup's compiler is Delphi/Windows-only and Ubuntu ships no innosetup package, which is
          # why this is a Windows job rather than a step in `release`. The image may already carry Inno
          # Setup. One step because step scope is not shared -- a path resolved here would not survive
          # into a later step.
          #
          # Failure visibility: this job runs on a tag, only after both build jobs pass, and the check
          # annotation GitHub writes for a pwsh step is just "Process completed with exit code 1" -- the
          # real reason lives in the log body that a non-admin cannot fetch. Every branch here therefore
          # writes its own ::error:: annotation and appends to GITHUB_STEP_SUMMARY, so the tag-run's
          # failing UI shows which candidate/step/exit-status actually died without leaving the browser.
          # $ErrorActionPreference='Stop' turns a cmdlet failure (Get-Item, Resolve-Path, ...) into a
          # terminating error, so we don't fall through with a half-computed value.
          $ErrorActionPreference = 'Stop'

          # A workflow command is a single line of the log stream, so its data field has three reserved
          # characters: '%' introduces an escape, and CR/LF would end the command early -- everything
          # after a stray newline is printed as an ordinary log line and the annotation quietly never
          # exists. .NET exception messages are multi-line all the time (Invoke-WebRequest's status +
          # reason phrase, choco's own error block), so every payload goes through here. Order matters:
          # '%' must be escaped first or it would re-escape the '%' the CR/LF escapes introduce.
          # Verified against pwsh 7.6: emitting "::error::`n-containing`ntext" produced exactly the
          # broken two-line command this prevents.
          function Set-WorkflowText([string]$msg) {
            $s = $msg -replace '%', '%25'
            $s = $s -replace "`r", '%0D'
            $s = $s -replace "`n", '%0A'
            return $s
          }

          function Fail([string]$msg) {
            Write-Host "::error::$(Set-WorkflowText $msg)"
            if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "`n### installer failure`n`n$msg" }
            throw $msg
          }

          # Non-fatal: records why a fallback is being taken without ending the step.
          function Warn([string]$msg) {
            Write-Host "::warning::$(Set-WorkflowText $msg)"
            Write-Host $msg
          }

          # Both majors are candidates. Inno Setup 7 installs beside 6 rather than over it, so a runner
          # holding either is usable, and a list naming only "Inno Setup 6" would report "ISCC.exe not
          # found" on a machine that has the current release. Which one to use is decided further down
          # by probing each of them, never by the number in the folder name: that number is the product
          # line, and it is not evidence about what the binary inside can do.
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
                          "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
                          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")

          # WizardStyle's appearance modes -- the `dark` packaging/windows_installer.iss asks for --
          # arrived in Inno Setup 6.6.0, and an older compiler refuses the value and fails the build.
          # This is the version floor the step reports against.
          $min = [version] '6.6'

          # Why the version comes out of the compiler and never out of its PE version resource: every
          # binary in the shipped 6.7.3 package reports FileVersion AND ProductVersion as 0.0.0.0.
          # Verified by extracting app/ISCC.exe, Compil32.exe, ISCmplr.dll and ISPP.dll out of
          # innosetup-6.7.3.exe with innoextract and reading them with exiftool -- jrsoftware does not
          # stamp them. A gate built on VersionInfo therefore cannot pass even against a current
          # compiler, which is how a healthy runner produced the annotation
          # "ISCC 0.0.0.0 ... is still older than 6.6" while the real file was 6.7.3.
          #
          # ISCC is its own authority. Projects/ISCC.dpr prints
          #   'Compiler engine version: ' + Ver.Title + ' ' + Ver.Version
          # to stdout on any run that is not /Q-quiet, so compiling names the version. Passing /O-
          # ('/O' with the value '-' sets Output := no') validates an entire script without writing an
          # installer, so the same invocation doubles as a capability probe: exit 0 means this
          # compiler really does take WizardStyle=modern dark, and a script error exits 2 (a bad
          # option or an exception exits 1). Asking the compiler to perform the thing we depend on
          # cannot be fooled by a build that stamps its resources differently, in either direction.
          $probeDir = Join-Path $env:RUNNER_TEMP 'iscc-probe'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null

          # Assembled from an array rather than a here-string on purpose: a here-string's closing "@
          # must sit in column 0, and a column-0 line would end this step's YAML block scalar.
          #
          # Every directive except the one under test has existed since Inno Setup 6.0, so a refusal
          # points at WizardStyle rather than at an unrelated newer keyword. [Files] ships the probe
          # script itself, which always exists, so the compile cannot fail for want of a source, and
          # deleteafterinstall stops it mattering where it lands. ASCII because ISCC is not fed a BOM.
          $probeIss = Join-Path $probeDir 'probe.iss'
          @(
            '[Setup]'
            'AppName=MuffinProbe'
            'AppVersion=1.0'
            'DefaultDirName={autopf}\MuffinProbe'
            'DisableProgramGroupPage=yes'
            "OutputDir=$probeDir"
            'OutputBaseFilename=probe'
            'WizardStyle=modern dark'
            ''
            '[Files]'
            ('Source: "{0}"; DestDir: "{{tmp}}"; Flags: deleteafterinstall' -f $probeIss)
          ) | Set-Content -Path $probeIss -Encoding ascii

          # Describe one ISCC.exe: the version it reports for itself, plus whether the probe compiled.
          # $Version stays $null when the banner does not match, so an unrecognised format is reported
          # as unknown rather than guessed at.
          #
          # The preference is dropped to Continue around the native call on purpose. With 'Stop', a
          # PowerShell that promotes redirected native stderr into a terminating error would raise on
          # a compiler that merely printed a warning, and $LASTEXITCODE -- the actual verdict -- would
          # never be read. The exit code is the gate, so it has to survive the call.
          function Read-Iscc([string]$path) {
            $saved = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              $out = & $path '/O-' $probeIss 2>&1
              $code = $LASTEXITCODE
            } finally { $ErrorActionPreference = $saved }
            $txt = ($out | Out-String)
            $v = $null
            if ($txt -match 'Compiler engine version:.*?(\d+\.\d+(?:\.\d+)*)') { $v = [version] $Matches[1] }
            [pscustomobject] @{ Path = $path; Version = $v; Capable = ($code -eq 0); Exit = $code; Output = $txt }
          }

          # Probe every candidate and return the highest version among those the probe ACCEPTED.
          # Failing probes are echoed rather than swallowed: a compiler that refuses modern dark, with
          # its own words attached, is the most useful line in this log and names the reason directly.
          function Select-Iscc {
            $seen = @()
            foreach ($c in $candidates) {
              if (-not (Test-Path $c)) { Write-Host "candidate absent: $c"; continue }
              $r = Read-Iscc $c
              $seen += $r
              Write-Host "candidate probed: $c (version=$($r.Version) probe_exit=$($r.Exit) capable=$($r.Capable))"
              if (-not $r.Capable) { Write-Host "--- probe output from $c ---`n$($r.Output)--- end of probe output ---" }
            }
            $ok = @($seen | Where-Object { $_.Capable -and $_.Version })
            if ($ok.Count -eq 0) { return $null }
            return ($ok | Sort-Object -Property Version -Descending | Select-Object -First 1)
          }

          # "An ISCC.exe exists" is NOT "an ISCC.exe can build this installer": Select-Iscc only
          # returns a compiler that actually compiled the modern-dark probe. Fetch a current release
          # whenever nothing usable came back, then rescan. `upgrade` installs when
          # choco has no record of it and brings it to latest when it does; --force re-runs the
          # installer even if choco already reports the latest, so the on-disk ISCC.exe is really
          # overwritten rather than left at the pre-installed old copy. Wrapped in try/catch because
          # $ErrorActionPreference='Stop' turns "choco not on PATH" into a terminating error -- on
          # windows-2022 choco is always there, but a future image that drops it should still get to
          # the direct-download fallback below rather than dying inside this block.
          $found = Select-Iscc
          if (-not $found -or $found.Version -lt $min) {
            if ($found) { Write-Host "ISCC $($found.Version) at $($found.Path) is below $min -- upgrading via Chocolatey" }
            else { Write-Host "no ISCC.exe that compiles WizardStyle=modern dark -- installing via Chocolatey" }
            try {
              & choco upgrade innosetup --yes --no-progress --force
              if ($LASTEXITCODE -ne 0) { Warn "choco upgrade innosetup returned exit $LASTEXITCODE; falling back to a direct download" }
              $found = Select-Iscc
            } catch {
              Warn "choco upgrade threw: $($_.Exception.Message); falling back to a direct download"
            }
          }

          # Last-resort fallback: Chocolatey's community feed can lag the vendor, or the runner's
          # outbound proxy can deny it. Pull the compiler straight from jrsoftware's own GitHub
          # releases (jrsoftware.org/isdl.php links there, and files.jrsoftware.org only carries the
          # .issig sidecar files, not the .exe) and run its installer silently. 6.7.3 is the latest
          # 6.x at the time of writing; the tag on the issrc repo is is-6_7_3. If the version moves
          # under us the download 404s and Fail() says so.
          # /ALLUSERS matches how the image's own preinstall lands in Program Files so $candidates
          # still picks it up, /VERYSILENT + /SUPPRESSMSGBOXES + /NORESTART keeps the run
          # non-interactive. Skipped entirely when the Chocolatey path already produced a compiler
          # that clears the floor.
          #
          # The download is retried because this is the one branch that depends on a remote host
          # answering: a single transient TLS/5xx failure used to end a tag release. Fail() is only
          # reached after three attempts, and it names the attempt count so a proxy block reads
          # differently from a dead URL.
          if (-not $found -or $found.Version -lt $min) {
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
            $tmp = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
            Write-Host "falling back to a direct download of innosetup-6.7.3.exe from jrsoftware/issrc"
            $dlErr = $null
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest -Uri $url -OutFile $tmp -UseBasicParsing -MaximumRedirection 5
                $dlErr = $null
                break
              } catch {
                $dlErr = $_.Exception.Message
                Warn "download attempt $attempt/3 failed: $dlErr"
                if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
              }
            }
            if ($dlErr) {
              Fail "could not download $url after 3 attempts; last error: $dlErr"
            }
            Write-Host "downloaded $((Get-Item $tmp).Length) bytes to $tmp"
            # -PassThru is not decorative here. Without it Start-Process reports nothing about the
            # child, so an installer that aborted (a 1/2/6 exit -- cancelled, invalid parameters,
            # reboot-required) would look like a clean success and the only clue left behind would be
            # the later "ISCC.exe not found", which names the wrong thing. The code is a warning, not
            # a Fail: a nonzero exit can mean "installed, reboot pending", and the version gate below
            # is what actually decides whether the compiler is usable.
            $proc = Start-Process -FilePath $tmp `
                                  -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES','/ALLUSERS' `
                                  -Wait -PassThru
            if ($proc.ExitCode -ne 0) { Warn "innosetup-6.7.3.exe exited with $($proc.ExitCode); rescanning anyway" }
            $found = Select-Iscc
          }

          # Both fallbacks ran and nothing usable appeared. Two distinct outcomes, kept distinct: a
          # compiler that is absent is not the same complaint as one that is present but refuses the
          # directive, and the second is the one that names WizardStyle as the blocker.
          if (-not $found) {
            Fail "no ISCC.exe among the candidates compiles WizardStyle=modern dark after Chocolatey + direct-download (looked in: $($candidates -join ', ')). Either none is installed, or every installed one predates the 6.6 appearance modes -- see the probe output above."
          }
          # The probe, not the number, is the gate: a compiler that compiled "WizardStyle=modern dark"
          # can build the release regardless of what it labels itself. Reaching here with a version
          # below $min therefore means the banner and the behaviour disagree -- worth an annotation,
          # but not worth failing a release over, because the thing the floor existed to guarantee
          # (6.6 appearance modes) has just been demonstrated rather than inferred.
          if ($found.Version -lt $min) {
            Warn "ISCC at $($found.Path) reports $($found.Version), below the $min floor, yet compiled the modern-dark probe. Building with it; check why the banner and the behaviour disagree."
          }

          # $isccVer is deliberately not called $ver: the $ver two lines below is the release tag, and
          # a gate that compares the tag against 6.6 would pass on every runner and mean nothing.
          $iscc = $found.Path
          $isccVer = $found.Version
          Write-Host "compiler: $iscc (version $isccVer)"

          # Not fatal, but it belongs in the run record rather than in a log nobody reads: the .iss was
          # authored and hand-checked against the 6.x line, and the majors are not interchangeable in
          # every respect (Inno Setup 7 documents ArchitecturesAllowed=x64 as excluding Arm64 systems
          # and recommends x64compatible, and it restates that a 32-bit installer is the default). The
          # probe proves this compiler accepts what the script asks for, so the build proceeds and the
          # difference is stated out loud.
          if ($found.Version.Major -ne 6) {
            Warn "building with Inno Setup $isccVer (major $($found.Version.Major)); packaging/windows_installer.iss was authored against the 6.x line. modern dark compiled, so this is allowed to ship, but compare the installer appearance before announcing the release."
          }

          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          # Re-declared, not inherited: $rel came from the previous step and step scope is not shared.
          $rel = 'win\build\Release'
          $staging = (Resolve-Path $rel).Path
          $out = (Resolve-Path 'pkg').Path
          # Tee ISCC's own output to the log AND to a variable so the failure path can quote it.
          # ISCC writes fatal compile errors to stdout, and its exit codes separate the kinds of
          # failure: Projects/ISCC.dpr sets ExitCode := 2 for a script error and := 1 for an
          # exception or a bad option, then Halts with it. Before the code was read here, a broken
          # script and a broken toolchain were indistinguishable -- both were "exit code 1".
          #
          # ErrorActionPreference is relaxed for the same reason it is inside Read-Iscc: the verdict
          # lives in $LASTEXITCODE, and a PowerShell that promotes redirected native stderr into a
          # terminating error would throw before that variable is read, taking ISCC's actual
          # complaint with it and leaving only a wrapper-level exit code behind.
          $saved = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            $isccOut = & $iscc "/DAppVersion=$ver" "/DStagingDir=$staging" "/DOutputDir=$out" `
                                "packaging\windows_installer.iss" 2>&1
            $isccCode = $LASTEXITCODE
          } finally { $ErrorActionPreference = $saved }
          $isccOut | ForEach-Object { Write-Host $_ }
          if ($isccCode -ne 0) {
            if ($env:GITHUB_STEP_SUMMARY) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("`n### ISCC failed (exit $isccCode)`n`n" + ($isccOut | Out-String))
            }
            # One line for the annotation: the code plus the compiler's last words. The whole output
            # is above it in the log and in the summary.
            $tail = ($isccOut | Select-Object -Last 6) -join ' / '
            Fail "ISCC exited with $isccCode; last output: $tail"
          }

          # A zero exit code with nothing on disk is its own failure mode (a wrong /DOutputDir, an
          # OutputBaseFilename change), and it would otherwise be caught only by upload-artifact's
          # if-no-files-found, several steps and one lost run later.
          $built = @(Get-ChildItem pkg -Filter '*.exe')
          if ($built.Count -eq 0) {
            Fail "ISCC exited 0 but left no .exe in $out; expected Muffin-Setup-$ver.exe"
          }
          $built | ForEach-Object { Write-Host "built: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MiB)" }
          # Success is recorded too, with the compiler that produced it: the version the probe read
          # is the fact a later "why does this installer look different" question needs, and today it
          # only exists in a log that expires.
          if ($env:GITHUB_STEP_SUMMARY) {
            $rows = ($built | ForEach-Object { "- $($_.Name) - $([math]::Round($_.Length / 1MB, 1)) MiB" }) -join "`n"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "`n### Installer built`n`nCompiler: $iscc (version $isccVer), accepted WizardStyle=modern dark`nVersion from tag: $ver`n`n$rows"
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-setup-x64
          path: pkg/*.exe
          if-no-files-found: error

  # The release is what turns a tag into an installable artifact feed. It is deliberately a
  # separate job rather than a step inside `installer`: (a) installer runs on windows-2022 where
  # `gh release` upload would be a Windows-gh build for no reason, (b) the release needs to
  # consume both the .deb (from linux) and the .exe (from installer) — only an aggregator can see
  # both, and pinning it to linux keeps the tooling identical between the .deb and the release.
  #
  # `needs` covers everything the release must have: linux -> the .deb is verified & produced;
  # installer -> transitively needs windows, which runs ctest. So a green tag-run implies a
  # passing test suite for both platforms before the release exists. `gh release create` will
  # fail cleanly if the tag already has a release, which is the desired behaviour — never
  # overwrite a shipped artifact.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [linux, installer, arch] 
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Fetch the .deb
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-deb-x64
          path: rel

      - name: Fetch the installer
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-setup-x64
          path: rel

      - name: Fetch the Arch package
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-pkg-x64
          path: rel

      - name: Check the payload
        run: |
          set -euo pipefail
          mapfile -t debs < <(find rel -maxdepth 2 -name '*.deb' -type f)
          mapfile -t exes < <(find rel -maxdepth 2 -name '*.exe' -type f)
          mapfile -t pkgs < <(find rel -maxdepth 2 -name '*.pkg.tar.zst' -type f)

          echo "debs: ${debs[*]:-<none>}"
          echo "exes: ${exes[*]:-<none>}"
          echo "pkgs: ${pkgs[*]:-<none>}"

          (( ${#debs[@]} == 1 )) || { echo "expected exactly one .deb"; exit 1; }
          (( ${#exes[@]} == 1 )) || { echo "expected exactly one .exe"; exit 1; }
          (( ${#pkgs[@]} == 1 )) || { echo "expected exactly one .pkg.tar.zst"; exit 1; }

          mkdir -p out
          mv "${debs[0]}" "${exes[0]}" "${pkgs[0]}" out/
          chmod +r out/*    # Даем права на чтение, чтобы gh точно смог их загрузить
          ls -la out

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Muffin $GITHUB_REF_NAME" \
            out/*.deb out/*.exe out/*.pkg.tar.zst
          echo "published: $(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
  # Arch Linux packaging, in its own job. Two reasons it is not folded into `linux`: the build
  # environment is genuinely different (makepkg compiles against the DISTRO Qt in qt6-base, whereas
  # the `linux` job compiles against an aqt-installed Qt 6.7.3 on Ubuntu), and a clean Arch container
  # is the only place that exercises the PKGBUILD a user would actually run -- a broken recipe fails
  # here instead of on someone's machine.
  #
  # It deliberately does NOT feed the `release` job: that job asserts exactly one .deb and one .exe,
  # so wiring arch into its `needs` would add a gate it was never designed to satisfy. The .pkg.tar.zst
  # is published as a standalone artifact on every run (including PRs), which is what keeps the recipe
  # honest against the tree under test rather than only at tag time.
  #
  # The official archlinux image runs every step as root, but makepkg refuses to run as root by design
  # (a rogue PKGBUILD could clobber the system). Hence the split: pacman installs dependencies as root,
  # then the build drops to an unprivileged `builder` account that owns the checkout so makepkg may
  # write src/, pkg/ and the artifact in place.
  arch:
    name: Build the Arch package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install the build and runtime dependencies
        run: |
          set -euo pipefail
          # -Syu before -S: the image's package database is baked at build time and lags the mirrors,
          # so installing straight against that stale index can fail on inter-package version skew.
          # All depends/makedepends are installed here so the later `makepkg -s` finds them already
          # satisfied and never needs sudo (builder cannot call pacman).
          pacman -Syu --noconfirm base-devel cmake ninja gcc qt6-base qt6-svg polkit

      - name: Build the package as an unprivileged user
        run: |
          set -euo pipefail
          useradd -m builder
          # makepkg writes src/ (the fetched source), pkg/ (the install staging root) and the final
          # .pkg.tar.zst inside the PKGBUILD's own directory, so builder must own the checkout tree.
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # runuser switches the effective user while keeping the job's environment (PATH and
          # GITHUB_WORKSPACE), but HOME would otherwise stay /root and break makepkg's download cache
          # (~/.cache/makepkg) -- so HOME is redirected into builder's home. Deps are already present,
          # so `-s` resolves without a network/sudo step.
          runuser -u builder -- env HOME=/home/builder \
            sh -c 'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg -s --noconfirm'

      - name: Verify the package payload
        run: |
          set -euo pipefail
          # Exactly one package, and every path the app's runtime actually depends on present in it:
          # the lowercase binary, the privilege helper at its hardcoded path, the hicolor icon, the
          # desktop entry, and the license. tar member names may or may not carry a leading "./"
          # depending on bsdtar, so each pattern is anchored only at the end. nullglob makes an absent
          # package expand to nothing (count 0 -> the guard below fires with a clear message) instead of
          # leaving the literal pattern in place, which would read as exactly one match.
          shopt -s nullglob
          pkgs=( "$GITHUB_WORKSPACE"/packaging/arch/muffin-*.pkg.tar.zst )
          (( ${#pkgs[@]} == 1 )) || { echo "expected exactly one .pkg.tar.zst, found ${#pkgs[@]}: ${pkgs[*]}"; exit 1; }
          echo "package: ${pkgs[0]##*/}"
          tar -tf "${pkgs[0]}" | tee /tmp/pkg-list
          for path in \
            usr/bin/muffin \
            usr/lib/muffin/muffin-install-helper \
            usr/share/icons/hicolor/scalable/apps/muffin.svg \
            usr/share/applications/muffin.desktop \
            usr/share/licenses/muffin/LICENSE; do
            grep -q "$path\$" /tmp/pkg-list \
              || { echo "the package is missing $path"; exit 1; }
          done

      - name: Upload the package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-pkg-x64
          path: packaging/arch/muffin-*.pkg.tar.zst
          if-no-files-found: error

