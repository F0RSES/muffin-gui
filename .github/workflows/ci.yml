name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Two separate jobs (not a matrix) so a single OS can be re-run independently while the
# Windows MSVC path is still being debugged. Runner images are pinned explicitly:
#   - ubuntu-latest is migrating to a newer Ubuntu shortly and its apt Qt would float with it,
#   - windows-latest tracks the newest VS/Windows image; windows-2022 pins VS 2022.
#
# Qt is installed by jurplel/install-qt-action@v4.4.1 on BOTH platforms, pinned to the same
# concrete 6.7.3 (no wildcards). The distro Qt from apt can no longer be used: the project's
# real floor is Qt 6.6, not 6.2 —
#   - QPalette::Accent            -> Qt 6.6  (src/ui/Theme.cpp:80)
#   - QStyleHints::colorScheme()  -> Qt 6.5  (src/ui/Theme.cpp:121)
#   - Qt::ColorScheme             -> Qt 6.5
# Ubuntu 22.04 ships Qt 6.2.4, which has none of these (that is what broke the Linux job).
# Using one installer on both runners also removes OS version drift: Linux and Windows now
# compile against byte-identical headers, so an API that exists on one exists on the other.
#
# install-qt-action facts verified against the code it ships at tag v4.4.1:
#   - `modules` is deliberately ABSENT. It names aqtinstall add-on modules; an unknown name
#     ("qtsvg", "qtbase") makes aqt fail — that is what broke the Windows job. QtBase is always
#     installed and is not a module; SVG rendering support is not something this build needs
#     requested separately.
#   - `install-deps` defaults to true and, on Linux only, runs its own `sudo apt-get update`
#     plus installs build-essential, libgl1-mesa-dev, libxkbcommon-dev, the xcb libs and
#     libxcb-cursor0 (Qt >= 6.5) that the pre-built Qt needs at link/run time. It runs before
#     the download, so the apt step below exists mainly for ninja/cmake.
#   - The action exports QT_ROOT_DIR. It does NOT export `Qt6_DIR` (that name only exists as the
#     CMake cache variable written by find_package(Qt6)); `Qt5_DIR` is set for Qt 5 only. So the
#     CMake prefix is taken from $QT_ROOT_DIR/lib/cmake, as the action's README recommends.
#   - `cache: true` keys the automatic cache on version/host/target/arch, so it stays correct
#     when the pinned version is bumped.
#
# Tests run in fixture mode: forcing ZAPRET_TEST_TREE to a non-existent path makes coretest
# generate a minimal zapret distribution tree (see tests/coretest.cpp), so the parser/locator
# assertions stay meaningful without downloading zapret, and checkWindowsCount asserts landmarks
# only (g_winStrategies == -1 for an unpinned tree). uitest runs headless on the offscreen
# platform plugin, which CMakeLists.txt locates via ${Qt6_DIR}/../../../plugins/platforms —
# for an aqt install that resolves to $QT_ROOT_DIR/plugins/platforms, where the plugin really is.
#
# Packaging lives partly inside the two build jobs and partly in a fifth one:
#   - The .deb is produced at the tail of the `linux` job. CPack needs the same build tree that
#     just ran ctest, and dpkg-deb is available everywhere Ubuntu is, so a dedicated job would
#     only re-install Qt and re-run cmake for no benefit.
#   - The .exe cannot live in the `windows` job because Inno Setup's compiler (ISCC) is
#     Delphi/Windows-only and the payload has to be validated before it is packaged; a separate
#     `installer` job makes that gate explicit.
#   - `release` is tag-gated and needs both packaging jobs, so a release is never published from
#     a commit whose tests did not pass. See the two jobs at the bottom of this file.
# Every packaging step reads MUFFIN_VERSION / AppVersion from the tag itself (Configure here,
# ISCC in the installer job), which is what keeps the .deb file name, the .exe file name and the
# git tag in agreement.

jobs:
  linux:
    name: Linux (ubuntu-22.04, Qt 6.7.3)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Lint Inno Setup script
        # ISCC rejects an unknown token in a [Run] `Flags:` value with
        # `Parameter "Flags" includes an unknown flag.` -- which is a compile-time check on text that
        # never needed Windows, Qt or the build to happen first. Doing it here costs ~2 s on Linux and
        # stops the run before the tag-gated `installer` job burns a Windows runner (install Qt ->
        # build -> artifact round-trip -> ISCC) to report the same typo.
        # It lives in `linux` and not `windows` because `linux` is the job that runs on every push and
        # PR; `installer` only exists on a tag, so a branch-level typo would go unnoticed until release.
        run: python3 packaging/check-iss-flags.py packaging/windows_installer.iss

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ libgl1-mesa-dev

      - name: Configure
        # MUFFIN_VERSION is only stamped when this is a release tag: on a PR/branch build the
        # default in CMakeLists.txt is fine (and cpack is skipped below anyway). Stripping the
        # leading `v` is what makes muffin_<tag-without-v>_amd64.deb line up with the tag name,
        # matching what `installer` does for the .exe.
        run: |
          ver_args=()
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver_args+=("-DMUFFIN_VERSION=${GITHUB_REF_NAME#v}")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake" "${ver_args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test (fixture mode)
        env:
          QT_QPA_PLATFORM: offscreen
          ZAPRET_TEST_TREE: /tmp/not-a-zapret-tree
        run: ctest --test-dir build --output-on-failure

      # CPack runs against the tree that just passed ctest; the DEB generator is auto-selected in
      # CMakeLists.txt because dpkg-deb is present on ubuntu-22.04. Pinning -G DEB here anyway so a
      # future change to the auto-default cannot silently turn the release into a TGZ.
      - name: Build the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: cpack -G DEB
        working-directory: build

      # Verify the .deb actually contains what we claim. CPack would happily produce an empty or
      # misnamed package if the install() rules or the version threading drifted.
      - name: Verify the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          expected="muffin_${GITHUB_REF_NAME#v}_amd64.deb"
          if [[ ! -f "build/$expected" ]]; then
            echo "expected build/$expected, found:"; ls -la build/*.deb || true
            exit 1
          fi
          # Control fields the release actually depends on.
          dpkg-deb -f "build/$expected" Package Version Architecture Depends \
            | tee /tmp/deb-control
          grep -q "^Package: muffin$"                /tmp/deb-control
          grep -q "^Version: ${GITHUB_REF_NAME#v}$"  /tmp/deb-control
          grep -q "^Architecture: amd64$"            /tmp/deb-control
          # Payload: binary + desktop entry + themed icon (see install() rules in CMakeLists.txt).
          dpkg-deb -c "build/$expected" > /tmp/deb-list
          grep -q './usr/bin/Muffin$'                                   /tmp/deb-list
          grep -q './usr/share/applications/muffin.desktop$'            /tmp/deb-list
          grep -q './usr/share/icons/hicolor/scalable/apps/muffin.svg$' /tmp/deb-list
          echo "deb ok: $(du -h "build/$expected" | cut -f1)"

      - name: Upload the .deb
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-deb-x64
          path: build/muffin_*.deb
          if-no-files-found: error

      - name: Upload portable artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-linux-x64
          path: |
            build/Muffin
            packaging/muffin.desktop
            packaging/muffin.svg
            README.md
            LICENSE

  windows:
    name: Windows (windows-2022, Qt 6.7.3 MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Install Qt6
        # win64_msvc2019_64 is the correct arch for Qt 6.7 on VS 2022 (the MSVC 2019 and 2022
        # toolsets are binary-compatible); win64_msvc2022_64 only exists from Qt 6.8 on.
        uses: jurplel/install-qt-action@v4.4.1
        with:
          version: '6.7.3'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR/lib/cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test (fixture mode)
        env:
          QT_QPA_PLATFORM: offscreen
          ZAPRET_TEST_TREE: /tmp/not-a-zapret-tree
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Deploy Qt DLLs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          windeployqt --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw build/Release/Muffin.exe

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-windows-x64
          # The last three directories are windeployqt/Qt-version dependent. upload-artifact only
          # reports if-no-files-found when the whole list matched nothing, so listing a directory that
          # this Qt does not ship neither fails the job nor leaves the installer missing it: ISCC reads
          # whatever arrived. iconengines matters most (qsvgicon.dll renders the toolbar SVG icons).
          path: |
            build/Release/Muffin.exe
            build/Release/Qt6*.dll
            build/Release/platforms/
            build/Release/imageformats/
            build/Release/styles/
            build/Release/iconengines/
            build/Release/networkinformation/
            build/Release/tls/
            README.md
            LICENSE


  installer:
    name: Windows installer (Inno Setup)
    runs-on: windows-2022
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5.1.0

      - name: Fetch the Windows build
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-windows-x64
          path: win
          # upload-artifact keeps the workspace-relative paths it was handed, so the payload arrives
          # under win\build\Release rather than win\. That nesting is why the .iss is given StagingDir
          # explicitly instead of relying on its hand-run default.

      - name: Check the payload
        shell: pwsh
        run: |
          $rel = 'win\build\Release'
          foreach ($f in @('Muffin.exe', 'platforms\qwindows.dll')) {
            if (-not (Test-Path (Join-Path $rel $f))) {
              throw "artifact is missing $f -- refusing to package a broken payload"
            }
          }
          # A Qt6*.dll that simply was not deployed would otherwise compile into an installer that
          # ships no Qt at all (the .iss tolerates a missing source), so it is asserted here.
          if (-not (Get-ChildItem $rel -Filter 'Qt6*.dll' -File)) { throw "no Qt6*.dll in $rel" }
          $files = @(Get-ChildItem $rel -Recurse -File)
          $mib = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Output "payload ok: $($files.Count) files, $mib MiB"

      - name: Compile the installer
        shell: pwsh
        run: |
          # Inno Setup's compiler is Delphi/Windows-only and Ubuntu ships no innosetup package, which is
          # why this is a Windows job rather than a step in `release`. The image may already carry Inno
          # Setup; install it only when it does not. One step because step scope is not shared -- a path
          # resolved here would not survive into a later step.
          $candidates = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
                          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found (looked in: $($candidates -join ', '))" }
          Write-Output "compiler: $iscc"

          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          # Re-declared, not inherited: $rel came from the previous step and step scope is not shared.
          $rel = 'win\build\Release'
          $staging = (Resolve-Path $rel).Path
          & $iscc "/DAppVersion=$ver" "/DStagingDir=$staging" `
                  "/DOutputDir=$((Resolve-Path 'pkg').Path)" "packaging\windows_installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          Get-ChildItem pkg -Filter '*.exe' |
            ForEach-Object { Write-Output "built: $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MiB)" }

      - name: Upload the installer
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Muffin-setup-x64
          path: pkg/*.exe
          if-no-files-found: error

  # The release is what turns a tag into an installable artifact feed. It is deliberately a
  # separate job rather than a step inside `installer`: (a) installer runs on windows-2022 where
  # `gh release` upload would be a Windows-gh build for no reason, (b) the release needs to
  # consume both the .deb (from linux) and the .exe (from installer) — only an aggregator can see
  # both, and pinning it to linux keeps the tooling identical between the .deb and the release.
  #
  # `needs` covers everything the release must have: linux -> the .deb is verified & produced;
  # installer -> transitively needs windows, which runs ctest. So a green tag-run implies a
  # passing test suite for both platforms before the release exists. `gh release create` will
  # fail cleanly if the tag already has a release, which is the desired behaviour — never
  # overwrite a shipped artifact.
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: [linux, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write      # `gh release create` uploads release assets; the default token is read-only.
    steps:
      # Checkout is required here, not just for convenience: `gh release create` resolves the
      # target repository by walking up to a .git directory, so on a bare runner it dies with
      # "fatal: not a git repository". The download-artifact steps below write files but never
      # create a repo. `--verify-tag` is answered from the API rather than local refs, so the
      # default shallow checkout is enough — no fetch-depth/fetch-tags needed.
      - uses: actions/checkout@v5.1.0

      - name: Fetch the .deb
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-deb-x64
          path: rel

      - name: Fetch the installer
        uses: actions/download-artifact@v4.3.0
        with:
          name: Muffin-setup-x64
          path: rel

      - name: Check the payload
        # Exactly one .deb and one .exe: the release should fail loudly rather than silently
        # publish a broken set. `gh release create --verify-tag` also catches tag drift, but the
        # upstream jobs already gate on `refs/tags/v`, so this is a fast no-remote sanity pass.
        run: |
          set -euo pipefail
          mapfile -t debs < <(find rel -maxdepth 2 -name '*.deb' -type f)
          mapfile -t exes < <(find rel -maxdepth 2 -name '*.exe' -type f)
          echo "debs: ${debs[*]:-<none>}"
          echo "exes: ${exes[*]:-<none>}"
          (( ${#debs[@]} == 1 )) || { echo "expected exactly one .deb"; exit 1; }
          (( ${#exes[@]} == 1 )) || { echo "expected exactly one .exe"; exit 1; }
          # Move to a flat dir so `gh` uploads with a clean file name (download-artifact preserves
          # the workspace-relative path it was handed, so paths arrive as rel/build/*.deb, rel/pkg/*.exe).
          mkdir -p out
          mv "${debs[0]}" "${exes[0]}" out/
          ls -la out

      - name: Create the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Muffin $GITHUB_REF_NAME" \
            out/*.deb out/*.exe
          echo "published: $(gh release view "$GITHUB_REF_NAME" --json url -q .url)"
